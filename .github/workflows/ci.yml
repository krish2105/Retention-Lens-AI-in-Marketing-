name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --python 3.12
      - run: uv run pytest -q -W ignore

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/api/requirements.txt
      - run: PYTHONPATH=services/api pytest -q services/api/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx next build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t retentionlens-api .
      - name: Container answers its health check
        run: |
          docker run -d --name api -p 8000:8000 retentionlens-api
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Container refuses to start with sign-in off
        run: "! docker run --rm -e RL_AUTH_MODE=off retentionlens-api python -c 'import sys; sys.path.insert(0, \"services/api\"); import app.main'"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r services/api/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web

  rls:
    # Applies supabase/migrations to a real local Supabase stack and runs the two-tenant leak test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (migrations apply on start)
        run: |
          [ -f supabase/config.toml ] || supabase init --force
          # Container names come from project_id; the repo folder ends in '-', which is not a valid hostname.
          sed -i 's/^project_id = .*/project_id = "retentionlens"/' supabase/config.toml
          EXCLUDE=studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,storage-api,gotrue,kong,postgrest
          supabase start --ignore-health-check -x $EXCLUDE || (supabase stop --no-backup; sleep 30; supabase start --debug --ignore-health-check -x $EXCLUDE)
      - name: Row-level security isolation test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql
